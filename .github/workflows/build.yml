name: Build RedFoxGram

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: 8.9
      - name: Bundle Native Xray-core (arm64-v8a)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p composeApp/src/androidMain/jniLibs/arm64-v8a
          gh release download -R XTLS/Xray-core -p "Xray-android-arm64-v8a.zip" -O xray.zip || curl -fL "https://github.com" -o xray.zip
          unzip -o xray.zip xray -d xray_tmp
          mv xray_tmp/xray composeApp/src/androidMain/jniLibs/arm64-v8a/libxray.so
          chmod +x composeApp/src/androidMain/jniLibs/arm64-v8a/libxray.so
          rm -rf xray.zip xray_tmp
      - name: Build Debug APK
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RedFoxGram-Android-APK
          path: composeApp/build/outputs/apk/debug/*.apk

  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: 8.9
      - name: Package Linux Distribution
        run: gradle createDistributable --no-daemon
      - name: Archive Linux Build
        run: |
          mkdir -p dist_linux
          cp -r composeApp/build/compose/binaries/main/app/* dist_linux/
          tar -czf RedFoxGram-Linux-x64.tar.gz -C dist_linux .
      - uses: actions/upload-artifact@v4
        with:
          name: RedFoxGram-Linux-x64
          path: RedFoxGram-Linux-x64.tar.gz

  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: 8.9
      - name: Package Windows Executable
        run: gradle createDistributable --no-daemon
      - name: Archive Windows Build
        shell: pwsh
        run: Compress-Archive -Path composeApp\build\compose\binaries\main\app\* -DestinationPath RedFoxGram-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RedFoxGram-Windows-x64
          path: RedFoxGram-Windows-x64.zip
