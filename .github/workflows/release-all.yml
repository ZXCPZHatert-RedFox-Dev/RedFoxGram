name: Build RedFoxGram (Android, Linux, Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build Android APK
        run: ./gradlew :composeApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RedFoxGram-Android
          path: composeApp/build/outputs/apk/debug/*.apk

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Package Linux AppImage / DEB
        run: ./gradlew :composeApp:packageDistributionForCurrentOS
      - uses: actions/upload-artifact@v4
        with:
          name: RedFoxGram-Linux
          path: composeApp/build/compose/binaries/main/**/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Package Windows MSI / EXE
        run: ./gradlew :composeApp:packageDistributionForCurrentOS
      - uses: actions/upload-artifact@v4
        with:
          name: RedFoxGram-Windows
          path: composeApp/build/compose/binaries/main/**/*

  create-release:
    needs: [build-android, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
